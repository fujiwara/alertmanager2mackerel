route:
  receiver: mackerel
  group_by: ["alertname", "instance"]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: mackerel
    webhook_configs:
      - url: http://alertmanager2mackerel:8080/webhook
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            credentials: compose-token
