name: e2e
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    # Run on main and on the release pull requests created by tagpr.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'tagpr-from-')
    name: Alertmanager e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Run e2e tests
        run: |
          go test -tags e2e -v -count=1 ./e2e/
